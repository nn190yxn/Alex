name: Release Windows app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: arrive-focus/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: arrive-focus
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: arrive-focus
        run: pnpm typecheck

      - name: Test frontend
        working-directory: arrive-focus
        run: pnpm test -- --run

      - name: Build frontend
        working-directory: arrive-focus
        run: pnpm build

      - name: Check Rust formatting
        working-directory: arrive-focus
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust core and desktop feature
        working-directory: arrive-focus
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-app --lib

      - name: Lint Rust
        working-directory: arrive-focus
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features desktop-app -- -D warnings

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: arrive-focus
          args: --features desktop-app
          tagName: v__VERSION__
          releaseName: Arrive Focus v__VERSION__
          releaseBody: Download the Windows installer from the release assets.
          releaseDraft: false
          prerelease: false
