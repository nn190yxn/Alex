name: Build Document Index Windows Installers

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/document-index-windows.yml
      - document-index/**

permissions:
  contents: read

jobs:
  build-windows-installers:
    name: Build unsigned EXE and MSI
    runs-on: windows-latest
    defaults:
      run:
        working-directory: document-index

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: document-index/pnpm-lock.yaml

      - name: Install Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: document-index/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run frontend type check
        run: pnpm typecheck

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installers
        run: pnpm run tauri:build:windows

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: document-index-windows-installers-0.1.0
          path: |
            document-index/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            document-index/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
