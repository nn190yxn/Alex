<!doctype html>
<html lang="zh-CN">
<head>
  <script>try{var t=localStorage.getItem("expression-workbench-theme");if(t!=="orange"&&t!=="purple")t="blue";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","blue")}</script>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>术语</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>商业运营工作台</b></div>
      <nav></nav>
    </aside>
    <main>
      <div class="top">术语</div>
      <div class="hero">
        <div>
          <h1>术语</h1>
          <p class="sub">专名和固定叫法，例如「非标商业」「主力店」。按商业类型、空间、客群等分类查看。反复出现的词会标出来。</p>
        </div>
      </div>
      <section class="panel">
        <div class="lexicon-bar">
          <input class="search" data-term-search type="search" placeholder="找一个词" aria-label="找一个词">
          <span class="lexicon-count" data-term-count></span>
        </div>
        <div class="tabs lexicon-filters" data-term-filters></div>
        <div data-term-list></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
