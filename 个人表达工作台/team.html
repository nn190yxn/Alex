<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>团队审核</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside class="side"><div class="logo"><span class="mark">文</span><b>个人表达工作台</b></div><nav><button>⌂ 工作台首页</button><button>✦ 新建改写</button><button>◈ 我的方案语言</button><button>⌘ 行业知识库</button><button>◌ 多行业多场景</button><button>✓ 内容诊断</button><button>▤ 历史任务</button><button>▣ 文档资料中心</button><button>◇ 行业框架编辑器</button><button>↗ 表达规则发布中心</button><button class="active">☑ 团队审核</button></nav></aside><main><div class="top">工作台 / 团队审核</div><div class="hero"><div><h1>团队审核</h1><p class="sub">在发布前确认规则、样本与行业判断的一致性。下方提交内容和人员为审核流程示例。</p></div><button class="btn primary" data-review-batch>批量通过</button></div><section class="panel" data-review-list><div class="entry" data-review-id="客流承接关系规则"><label><input type="checkbox" data-review-select> 选择提交内容</label><h2>“客流承接关系”规则</h2><p>示例提交人：林然 · 经营策略型 · 12 分钟前</p><button class="btn" data-review-status="待审核">待审核</button><form data-review-comment><textarea name="comment" rows="2" placeholder="填写审核评论"></textarea><button class="btn" type="submit">保存评论</button></form><div data-review-comments></div></div><div class="entry" data-review-id="招商运营提案样本"><label><input type="checkbox" data-review-select> 选择提交内容</label><h2>招商运营提案样本</h2><p>示例提交人：周宁 · 商业地产 · 34 分钟前</p><button class="btn" data-review-status="待审核">待审核</button><form data-review-comment><textarea name="comment" rows="2" placeholder="填写审核评论"></textarea><button class="btn" type="submit">保存评论</button></form><div data-review-comments></div></div><div class="entry" data-review-id="品牌定位表达框架"><label><input type="checkbox" data-review-select> 选择提交内容</label><h2>品牌定位表达框架</h2><p>示例提交人：许安 · 品牌策略 · 昨天</p><button class="btn" data-review-status="待审核">待审核</button><form data-review-comment><textarea name="comment" rows="2" placeholder="填写审核评论"></textarea><button class="btn" type="submit">保存评论</button></form><div data-review-comments></div></div></section><section class="panel"><h2>审核记录</h2><div data-review-history><p>暂无审核记录。</p></div></section>
<section class="panel"><h2>团队角色说明</h2><div class="entry"><strong>管理员</strong><p>可管理资料、审核内容、发布表达规则和查看操作记录。</p></div><div class="entry"><strong>其他角色</strong><p>编辑人员可编辑内容；审核人员可审核内容；查看人员可阅读内容。实际可用操作由账号权限决定。</p></div></section><section class="panel"><h2>操作记录</h2><div id="audit-log">正在加载操作记录...</div></section>
</main></div>
<script src="app.js"></script><script>(function(){var h=document.getElementById("audit-log");fetch("/api/audit").then(function(r){return r.json();}).then(function(a){h.innerHTML=a.length?a.map(function(x){return "<p>"+({create:'新增',update:'修改',restore:'恢复备份',rollback:'恢复版本',resolve:'合并规则',use:'使用模型服务'}[x.action]||'资料操作')+" · 资料编号："+x.resource+" · "+x.createdAt+"</p>";}).join(""):"暂无操作记录";}).catch(function(){h.textContent="服务暂不可用，请稍后重试。";});})();</script></body></html>
