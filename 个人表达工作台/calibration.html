<!doctype html>
<html lang="zh-CN">
<head>
  <script>try{var t=localStorage.getItem("expression-workbench-theme");if(t!=="orange"&&t!=="purple")t="blue";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","blue")}</script>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的写法</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>商业运营工作台</b></div>
      <nav></nav>
    </aside>
    <main>
      <div class="top">我的写法</div>
      <div class="hero">
        <div>
          <h1>我的写法</h1>
          <p class="sub">这里是你说话的习惯。系统从你改稿里自动学，觉得对就收下，不对就划掉。要改哪条，直接在「改一稿」里点改，它会跟着变。</p>
        </div>
      </div>
      <section class="panel inbox-panel" data-calib-inbox></section>
      <section class="panel">
        <h2>我的写法</h2>
        <p class="sub">按你说的话归类，不必记字段。收下的会用进出稿。</p>
        <div data-calib-groups></div>
      </section>
      <section class="panel">
        <h2>记一条我发现的写法</h2>
        <p class="sub">一句话写下你想固定下来的说法，系统自动归类。</p>
        <textarea class="calib-note" data-calib-note placeholder="例如：不说核心竞争力，直接说课时和续费率"></textarea>
        <div class="actions mt-3">
          <button class="btn primary" type="button" data-calib-add>记下</button>
        </div>
      </section>
      <section class="panel" data-calib-practice>
        <h2>练一练（可选）</h2>
        <p class="sub">用题练手，或用稿做二轮校准。题库一次十几道，边改边收；文稿按你说的话扫一篇。</p>
        <div class="tabs" data-practice-modes>
          <button type="button" class="chip active" data-practice-mode="drill">题库校准</button>
          <button type="button" class="chip" data-practice-mode="draft">文稿校准</button>
        </div>
        <div data-practice-drill>
          <div class="practice-bar">
            <label>维度<select data-practice-kind></select></label>
            <label>题量<select data-practice-count>
              <option value="6">6 道</option>
              <option value="12" selected>12 道</option>
              <option value="18">18 道</option>
            </select></label>
            <button class="btn primary" type="button" data-practice-start>开始一轮</button>
          </div>
          <p class="sub" data-practice-hint></p>
          <p class="sub" data-practice-progress role="status"></p>
          <div data-practice-list></div>
        </div>
        <div data-practice-draft hidden>
          <textarea data-practice-source placeholder="把一篇稿贴进来，按维度扫一遍。"></textarea>
          <div class="practice-bar">
            <button class="btn primary" type="button" data-practice-scan>扫一遍</button>
            <button class="btn" type="button" data-practice-apply disabled>采纳勾上的，生成校正稿</button>
            <button class="btn" type="button" data-practice-record disabled>把勾上的记成规则</button>
          </div>
          <p class="sub" data-practice-draft-status role="status"></p>
          <div data-practice-findings></div>
          <h3>校正稿</h3>
          <div class="practice-corrected" data-practice-corrected></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
