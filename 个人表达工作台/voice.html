<!doctype html>
<html lang="zh-CN">
<head>
  <script>try{var t=localStorage.getItem("expression-workbench-theme");if(t!=="orange"&&t!=="purple")t="blue";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","blue")}</script>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的语料</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .corpus-dim{margin:0 0 16px}
    .corpus-dim label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
    .corpus-dim .range{display:flex;gap:6px;flex-wrap:wrap}
    .corpus-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .corpus-hint{margin:0 0 14px;color:var(--muted);font-size:13px}
    .corpus-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
    .corpus-upload input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .corpus-upload span{color:var(--muted);font-size:13px}
    .corpus-upload .btn{display:inline-flex;align-items:center}
    .corpus-card{padding:16px 0;border-bottom:1px solid var(--line)}
    .corpus-card:last-child{border:0}
    .corpus-card p{margin:8px 0 0;color:var(--muted);line-height:1.7}
    #corpus-status{margin:10px 0 0;font-size:13px;color:var(--muted)}
    .corpus-card .meta{margin-top:6px;font-size:12px}
    .catalog-filters{display:grid;gap:10px;margin:12px 0 0}
    .filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .filter-row > span{flex:0 0 64px;color:var(--muted);font-size:12px}
    .corpus-more{margin:8px 0 4px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
    .corpus-more > summary{cursor:pointer;color:var(--muted);font-size:13px}
    .catalog-scene{margin:0 0 18px}
    .catalog-scene > h3{margin:0 0 8px;font-size:15px}
    .catalog-scene > h3 small{color:var(--muted);font-weight:400}
    .catalog-group{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:#fff;overflow:hidden}
    .catalog-group > summary{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;font-weight:700;list-style:none}
    .catalog-group > summary::-webkit-details-marker{display:none}
    .catalog-group > summary small{font-weight:400;color:var(--muted)}
    .catalog-group .corpus-card{padding:12px 16px;border-bottom:0;border-top:1px solid var(--line)}
    .catalog-group .corpus-card p{margin:4px 0 0;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>商业运营工作台</b></div>
      <nav></nav>
    </aside>
    <main>
      <div class="top">我的语料</div>
      <div class="hero">
        <div>
          <h1>我的语料</h1>
          <p class="sub">贴一篇你认的写法，或上传 txt、Markdown。先按写给谁收纳，再按什么料分开看。出稿时按同类语料改口气。</p>
        </div>
      </div>
      <form class="panel" data-corpus-form>
        <h2>收下一篇语料</h2>
        <p class="corpus-hint">按固定规则先分一档，你再改标签。数字和专名按原文收下。PDF 和 Word 现在读不了，请另存成 txt 或 Markdown。</p>
        <textarea name="body" id="corpus-body" placeholder="把你认的那篇方案，或一段你认的口气，贴在这里" required></textarea>
        <div class="corpus-upload">
          <label class="btn" for="corpus-file">上传文件</label>
          <input id="corpus-file" type="file" accept=".txt,.md,.markdown,.text,text/plain,text/markdown" multiple>
          <span>一次可选一篇，也可以一次选多篇直接收下。</span>
        </div>
        <input name="title" placeholder="这篇叫什么，可空" style="margin:10px 0 16px">
        <div class="corpus-dim" data-corpus-dim="kind">
          <label>这篇是什么料</label>
          <div class="range">
            <button type="button" class="chip active" data-value="整篇方案">整篇方案</button>
            <button type="button" class="chip" data-value="一段口气">一段口气</button>
            <button type="button" class="chip" data-value="标题写法">标题写法</button>
            <button type="button" class="chip" data-value="判断句">判断句</button>
            <button type="button" class="chip" data-value="表格说明">表格说明</button>
          </div>
        </div>
        <div class="corpus-dim" data-corpus-dim="scene">
          <label>这篇写给谁</label>
          <div class="range">
            <button type="button" class="chip active" data-value="招商对内汇报">招商 · 对内汇报</button>
            <button type="button" class="chip" data-value="招商对外演讲">招商 · 对外演讲</button>
            <button type="button" class="chip" data-value="运营方案">运营方案</button>
            <button type="button" class="chip" data-value="营销活动方案">营销活动方案</button>
            <button type="button" class="chip" data-value="沟通方案">沟通方案</button>
          </div>
        </div>
        <details class="corpus-more">
          <summary>写法细节，可后改</summary>
          <div class="corpus-dim" data-corpus-dim="style">
          <label>语言风格</label>
          <div class="range">
            <button type="button" class="chip active" data-value="正式汇报">正式汇报</button>
            <button type="button" class="chip" data-value="口语可讲">口语可讲</button>
            <button type="button" class="chip" data-value="判断句密">判断句密</button>
            <button type="button" class="chip" data-value="叙述铺陈">叙述铺陈</button>
          </div>
        </div>
        <div class="corpus-dim" data-corpus-dim="rhythm">
          <label>句子节奏</label>
          <div class="range">
            <button type="button" class="chip active" data-value="长句链条">长句链条</button>
            <button type="button" class="chip" data-value="短句落地">短句落地</button>
            <button type="button" class="chip" data-value="先长后短">先长后短</button>
          </div>
        </div>
        <div class="corpus-dim" data-corpus-dim="logic">
          <label>逻辑顺序</label>
          <div class="range">
            <button type="button" class="chip active" data-value="先结论后依据">先结论后依据</button>
            <button type="button" class="chip" data-value="先背景后判断">先背景后判断</button>
            <button type="button" class="chip" data-value="先问题后动作">先问题后动作</button>
          </div>
        </div>
        </details>
        <div class="corpus-actions">
          <button class="btn" type="button" id="corpus-classify">先分一档</button>
          <button class="btn primary" type="submit">收下这篇</button>
        </div>
        <p id="corpus-status" role="status"></p>
      </form>
      <section class="panel">
        <div class="toolbar">
          <h2 style="margin:0">已收下的语料</h2>
        </div>
        <div class="catalog-filters">
          <div class="filter-row" data-corpus-filter="scene">
            <span>写给谁</span>
            <button type="button" class="chip active" data-scene="all">全部</button>
            <button type="button" class="chip" data-scene="招商对内汇报">招商 · 对内汇报</button>
            <button type="button" class="chip" data-scene="招商对外演讲">招商 · 对外演讲</button>
            <button type="button" class="chip" data-scene="运营方案">运营方案</button>
            <button type="button" class="chip" data-scene="营销活动方案">营销活动方案</button>
            <button type="button" class="chip" data-scene="沟通方案">沟通方案</button>
          </div>
          <div class="filter-row" data-corpus-filter="kind">
            <span>什么料</span>
            <button type="button" class="chip active" data-kind="all">全部</button>
            <button type="button" class="chip" data-kind="整篇方案">整篇方案</button>
            <button type="button" class="chip" data-kind="一段口气">一段口气</button>
            <button type="button" class="chip" data-kind="标题写法">标题写法</button>
            <button type="button" class="chip" data-kind="判断句">判断句</button>
            <button type="button" class="chip" data-kind="表格说明">表格说明</button>
          </div>
        </div>
        <div id="corpus-list"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
