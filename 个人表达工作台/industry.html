<!doctype html>
<html lang="zh-CN">
<head>
  <script>try{var t=localStorage.getItem("expression-workbench-theme");if(t!=="orange"&&t!=="purple")t="blue";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","blue")}</script>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>资讯</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .extract-label{display:block;margin:12px 0 8px;color:var(--muted);font-size:13px}
    .corpus-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
    .corpus-upload input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    .corpus-upload span{color:var(--muted);font-size:13px}
    [data-extract-panel] textarea{min-height:140px;margin:8px 0}
    .extract-url-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
    .extract-url-row input{flex:1;min-width:220px}
    .extract-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
    [data-extract-hint],[data-extract-status]{margin:8px 0 0;font-size:13px;color:var(--muted)}
    .extract-list{display:grid;gap:8px;margin:8px 0 12px}
    .extract-list label{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
    .extract-list label.on{border-color:var(--brand);background:var(--soft)}
    .extract-list small{display:block;color:var(--muted);margin-top:4px}
    .extract-list input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--brand)}
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>商业运营工作台</b></div>
      <nav></nav>
    </aside>
    <main>
      <div class="top">行业术语</div>
      <div class="hero">
        <div>
          <h1>资讯</h1>
          <p class="sub">贴文、填公开链接后点「取这篇」，或上传 txt、Markdown。抽出的词会进入行业词库。多篇资讯里反复出现的词会慢慢排到前面。勾上商业类型再抽。连接词和过泛日常词会滤掉。</p>
        </div>
      </div>
      <section class="panel" data-extract-panel>
        <h2>从资讯里抽出用词</h2>
        <p class="sub">贴文、填链接后点「取这篇」，或上传 txt、Markdown。只抽商业运营能用的专名和习惯用语，抽出即进入行业词库。PDF 和 Word 现在读不了。</p>
        <p class="extract-label">这篇属于哪类商业</p>
        <div class="range" data-extract-types></div>
        <label class="extract-label" for="extract-url">资讯链接</label>
        <div class="extract-url-row">
          <input id="extract-url" data-extract-url type="url" placeholder="公开的 http 或 https 链接">
          <button class="btn" type="button" data-extract-fetch>取这篇</button>
        </div>
        <textarea data-extract-source placeholder="把资讯文章贴在这里。用链接时，先点「取这篇」，正文会出现在这里。"></textarea>
        <div class="corpus-upload">
          <label class="btn" for="extract-file">上传文件</label>
          <input id="extract-file" type="file" accept=".txt,.md,.markdown,.text,text/plain,text/markdown" multiple>
          <span>链接点「取这篇」。文件用「上传文件」。也可以直接把正文贴进来。</span>
        </div>
        <p data-extract-hint role="status"></p>
        <div class="extract-actions">
          <button class="btn primary" type="button" data-extract-run>抽出用词</button>
          <button class="btn" type="button" data-extract-accept disabled>收下勾上的项目</button>
        </div>
        <p data-extract-status role="status"></p>
        <div data-extract-groups></div>
      </section>
      <section class="panel" data-industry-packs></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
