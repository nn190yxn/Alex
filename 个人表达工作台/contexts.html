<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多行业多场景</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside class="side"><div class="logo"><span class="mark">文</span><b>个人表达工作台</b></div><nav><button>⌂ 工作台首页</button><button>✦ 新建改写</button><button>◈ 我的方案语言</button><button>⌘ 行业知识库</button><button class="active">◌ 多行业多场景</button><button>✓ 内容诊断</button><button>▤ 历史任务</button><button>▣ 文档资料中心</button><button>◇ 行业框架编辑器</button><button>↗ 表达规则发布中心</button><button>☑ 团队审核</button></nav></aside><main><div class="top">工作台 / 多行业多场景</div><div class="hero"><div><h1>多行业多场景</h1><p class="sub">按行业和写作场景整理表达规则与判断重点。初始场景为示例，可编辑后保存。</p></div><button class="btn primary" data-context-status-filter="all">全部状态</button></div><section class="panel"><div class="toolbar"><div class="tabs" data-context-type-filters><button class="active" data-context-type="all">全部场景</button><button data-context-type="地产">商业地产</button><button data-context-type="品牌">品牌策略</button><button data-context-type="组织">组织管理</button></div><div class="tabs"><button class="active" data-context-status="all">全部状态</button><button data-context-status="启用">启用</button><button data-context-status="停用">停用</button></div></div></section><form class="panel inline-form" data-context-form><h2>新建场景</h2><input name="industry" placeholder="类型，例如：商业地产" required><input name="name" placeholder="场景名称" required><input name="description" placeholder="场景说明" required><button class="btn primary">保存场景</button></form><section class="cards" data-contexts></section></main></div><script src="app.js"></script></body></html>
