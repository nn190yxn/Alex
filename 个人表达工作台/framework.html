<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行业框架编辑器</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .framework-node label, [data-framework-form] label { display: grid; gap: 8px; margin-bottom: 14px; }
    .framework-node input, .framework-node textarea, [data-framework-form] input, [data-framework-form] textarea { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--panel); font: inherit; }
    .framework-node textarea, [data-framework-form] textarea { resize: vertical; }
    .framework-node .btn { float: none; }
    .framework-node .btn:disabled { opacity: .4; cursor: default; }
    [data-framework-form] { margin-top: 16px; }
    @media (max-width: 800px) { main { min-width: 0; } .hero { flex-wrap: wrap; gap: 12px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>个人表达工作台</b></div>
      <nav><button>⌂ 工作台首页</button><button>✦ 新建改写</button><button>◈ 我的方案语言</button><button>⌘ 行业知识库</button><button>◌ 多行业多场景</button><button>✓ 内容诊断</button><button>▤ 历史任务</button><button>▣ 文档资料中心</button><button class="active">◇ 行业框架编辑器</button><button>↗ 表达规则发布中心</button><button>☑ 团队审核</button></nav>
    </aside>
    <main>
      <div class="top">工作台 / 行业框架编辑器</div>
      <div class="hero"><div><h1>行业框架编辑器</h1><p class="sub">调整表达规则的优先级，形成可复用的行业框架。</p></div><button type="button" class="btn primary" data-framework-save>保存版本</button></div>
      <p data-framework-status role="status" aria-live="polite"></p>
      <section class="panel" data-framework-nodes aria-label="框架节点"></section>
      <form class="panel inline-form" data-framework-form>
        <h2>新增框架节点</h2>
        <label>节点名称<input name="name" placeholder="节点名称" required></label>
        <label>节点说明<textarea name="description" placeholder="说明节点的表达要求" rows="3"></textarea></label>
        <button class="btn primary" type="submit">新增节点</button>
      </form>
    </main>
  </div>
  <script src="data-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
