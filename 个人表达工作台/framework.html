<!doctype html>
<html lang="zh-CN">
<head><script>try{var t=localStorage.getItem("expression-workbench-theme");if(t!=="orange"&&t!=="purple")t="blue";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","blue")}</script><link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>方案目录</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .framework-node label, [data-framework-form] label { display: grid; gap: 8px; margin-bottom: 14px; }
    .framework-node input, .framework-node textarea, [data-framework-form] input, [data-framework-form] textarea { width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--panel); font: inherit; }
    .framework-node textarea, [data-framework-form] textarea { resize: vertical; }
    .framework-node .btn { float: none; }
    .framework-node .btn:disabled { opacity: .4; cursor: default; }
    [data-framework-form] { margin-top: 16px; }
    @media (max-width: 800px) { main { min-width: 0; } .hero { flex-wrap: wrap; gap: 12px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo"><span class="mark">文</span><b>商业运营工作台</b></div>
      <nav></nav>
    </aside>
    <main>
      <div class="top">方案目录</div>
      <div class="hero"><div><h1>方案目录</h1><p class="sub">这篇方案先写哪几块，按这个顺序铺。</p></div><button type="button" class="btn primary" data-framework-save>保存版本</button></div>
      <p data-framework-status role="status" aria-live="polite"></p>
      <section class="panel">
        <h2>套用骨架</h2>
        <p class="sub">先点一份骨架，把这份方案要先写哪几块铺好，再逐块改。点单个章节，只加这一块。</p>
        <div data-framework-presets style="display:flex;gap:8px;flex-wrap:wrap"></div>
      </section>
      <section class="panel" data-framework-nodes aria-label="框架节点"></section>
      <form class="panel inline-form" data-framework-form>
        <h2>再加一块</h2>
        <label>这一块叫什么<input name="name" placeholder="这一块叫什么" required></label>
        <label>节点说明<textarea name="description" placeholder="这一块该怎么写" rows="3"></textarea></label>
        <button class="btn primary" type="submit">加上这块</button>
      </form>
    </main>
  </div>
  <script src="data-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
